name: Auto-update odds and results

on:
  schedule:
    # Every 6 hours at minute 7 — stays well within rate limits
    - cron: '7 */6 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update odds and results
        env:
          FIREBASE_DATABASE_URL: 'https://tip-odds-default-rtdb.asia-southeast1.firebasedatabase.app'
          ODDS_API_KEY: '90bd97b1a3d1f2a20fcfbab7362dd25b'
          FD_API_KEY: '832afb54b4444efd9ff13c6946929b4e'
        run: |
          node -e "
          const FB = process.env.FIREBASE_DATABASE_URL;
          const ODDS_KEY = process.env.ODDS_API_KEY;
          const FD_KEY = process.env.FD_API_KEY;

          async function fbGet(path) {
            const r = await fetch(FB + '/' + path + '.json');
            return r.ok ? r.json() : null;
          }
          async function fbPatch(path, data) {
            const r = await fetch(FB + '/' + path + '.json', {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
            });
            if (!r.ok) console.error('fbPatch failed:', path, await r.text());
          }
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            console.log('🔄 Starting auto-update at', new Date().toISOString());
            const comps = await fbGet('comps') || {};
            const compIds = Object.keys(comps);
            console.log('Found ' + compIds.length + ' comps');

            for (const compId of compIds) {
              const comp = comps[compId];
              const lockedRounds = comp.lockedRounds || {};
              console.log('\\n=== Processing: ' + comp.name + ' ===');

              // ODDS REFRESH from The Odds API
              if (comp.oddsKey) {
                try {
                  const oddsResp = await fetch('https://api.the-odds-api.com/v4/sports/' + comp.oddsKey + '/odds?apiKey=' + ODDS_KEY + '&regions=au&markets=h2h&oddsFormat=decimal');
                  if (oddsResp.ok) {
                    const oddsData = await oddsResp.json();
                    const matches = comp.matches || {};
                    let oddsUpdated = 0, oddsSkipped = 0;
                    for (const ev of (oddsData || [])) {
                      const home = ev.home_team, away = ev.away_team;
                      const matchEntry = Object.entries(matches).find(([_, m]) => m.home === home && m.away === away);
                      if (!matchEntry) continue;
                      const [matchId, match] = matchEntry;
                      const safeRound = match.round ? match.round.replace(/[.#\$\[\]/]/g, '_') : '';
                      if (safeRound && lockedRounds[safeRound]) { oddsSkipped++; continue; }
                      const bk = (ev.bookmakers || [])[0];
                      if (!bk) continue;
                      const market = (bk.markets || []).find(m => m.key === 'h2h');
                      if (!market) continue;
                      let oh, od, oa;
                      market.outcomes.forEach(o => {
                        if (o.name === home) oh = o.price;
                        else if (o.name === away) oa = o.price;
                        else if (o.name === 'Draw') od = o.price;
                      });
                      if (oh && oa) {
                        const jitter = () => 1 + (Math.random() * 0.1 - 0.05);
                        await fbPatch('comps/' + compId + '/matches/' + matchId, {
                          oddsH: oh, oddsD: od || oh, oddsA: oa,
                          noisyH: Math.round(oh * jitter() * 100) / 100,
                          noisyD: od ? Math.round(od * jitter() * 100) / 100 : null,
                          noisyA: Math.round(oa * jitter() * 100) / 100
                        });
                        oddsUpdated++;
                      }
                    }
                    console.log('  Odds: ' + oddsUpdated + ' updated, ' + oddsSkipped + ' locked');
                  } else {
                    const errText = await oddsResp.text();
                    if (errText.includes('UNKNOWN_SPORT')) console.log('  Odds: not in season yet');
                    else console.log('  Odds error: ' + oddsResp.status);
                  }
                } catch (e) {
                  console.log('  Odds fetch failed:', e.message);
                }
              }

              await sleep(2000);

              // RESULTS REFRESH from football-data.org
              if (comp.fdCode && comp.fdSeason) {
                try {
                  const url = 'https://api.football-data.org/v4/competitions/' + comp.fdCode + '/matches?season=' + comp.fdSeason + '&status=FINISHED';
                  const resResp = await fetch(url, { headers: { 'X-Auth-Token': FD_KEY } });
                  if (!resResp.ok) {
                    console.log('  Results API error: ' + resResp.status);
                  } else {
                    const resData = await resResp.json();
                    const matches = comp.matches || {};
                    let resUpdated = 0;
                    for (const mx of (resData.matches || [])) {
                      const apiId = 'fd_' + mx.id;
                      const m = matches[apiId];
                      if (!m || m.result) continue;
                      const sH = mx.score && mx.score.fullTime ? mx.score.fullTime.home : null;
                      const sA = mx.score && mx.score.fullTime ? mx.score.fullTime.away : null;
                      if (sH == null || sA == null) continue;
                      const result = sH > sA ? 'H' : sA > sH ? 'A' : 'D';
                      await fbPatch('comps/' + compId + '/matches/' + apiId, { result, scoreH: sH, scoreA: sA });
                      resUpdated++;
                    }
                    console.log('  Results: ' + resUpdated + ' updated');
                  }
                } catch (e) {
                  console.log('  Results fetch failed:', e.message);
                }
              }

              // AUTO-LOCK rounds within 7 days
              if (comp.matches) {
                const earliestByRound = {};
                Object.values(comp.matches).forEach(m => {
                  if (!m.round || !m.datetime) return;
                  const t = new Date(m.datetime).getTime();
                  if (!earliestByRound[m.round] || t < earliestByRound[m.round])
                    earliestByRound[m.round] = t;
                });
                const now = Date.now();
                const SEVEN = 7 * 24 * 60 * 60 * 1000;
                let lockedCount = 0;
                for (const [round, earliest] of Object.entries(earliestByRound)) {
                  const safeKey = round.replace(/[.#\$\[\]/]/g, '_');
                  if (lockedRounds[safeKey]) continue;
                  if (earliest - now <= SEVEN && earliest > now - SEVEN) {
                    await fbPatch('comps/' + compId + '/lockedRounds', { [safeKey]: true });
                    lockedCount++;
                  }
                }
                if (lockedCount) console.log('  Auto-locked ' + lockedCount + ' rounds');
              }

              await sleep(3000);
            }
            console.log('\\n✅ Done');
          })();
          "
