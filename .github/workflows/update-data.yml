name: Auto-update odds and results

on:
  schedule:
    # Every 6 hours at minute 7 — stays well within rate limits
    - cron: '7 */6 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update odds and results
        env:
          FIREBASE_DATABASE_URL: 'https://tip-odds-default-rtdb.asia-southeast1.firebasedatabase.app'
          ODDS_API_KEY: '90bd97b1a3d1f2a20fcfbab7362dd25b'
          FD_API_KEY: '832afb54b4444efd9ff13c6946929b4e'
        run: |
          node -e "
          const FB = process.env.FIREBASE_DATABASE_URL;
          const ODDS_KEY = process.env.ODDS_API_KEY;
          const FD_KEY = process.env.FD_API_KEY;

          async function fbGet(path) {
            const r = await fetch(FB + '/' + path + '.json');
            return r.ok ? r.json() : null;
          }
          async function fbPatch(path, data) {
            const r = await fetch(FB + '/' + path + '.json', {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
            });
            if (!r.ok) console.error('fbPatch failed:', path, await r.text());
          }
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            console.log('🔄 Starting auto-update at', new Date().toISOString());
            const comps = await fbGet('comps') || {};
            const compIds = Object.keys(comps);
            console.log('Found ' + compIds.length + ' comps');

            for (const compId of compIds) {
              const comp = comps[compId];
              const lockedRounds = comp.lockedRounds || {};
              console.log('\\n=== Processing: ' + comp.name + ' ===');

              // ODDS REFRESH from The Odds API
              if (comp.oddsKey) {
                try {
                  const oddsResp = await fetch('https://api.the-odds-api.com/v4/sports/' + comp.oddsKey + '/odds?apiKey=' + ODDS_KEY + '&regions=au&markets=h2h&oddsFormat=decimal');
                  if (oddsResp.ok) {
                    const oddsData = await oddsResp.json();
                    const matches = comp.matches || {};
                    let oddsUpdated = 0, oddsSkipped = 0;
                    const unmatched = [];

                    // === FUZZY TEAM NAME MATCHING ===
                    // Stop words that should be removed before comparison
                    const STOP = new Set(['fc','afc','cf','sc','ac','club','football','soccer','the','&','and','de','del','la','el','los','las','y','f.c.','c.f.','s.c.']);
                    // Common aliases — bidirectional. Reduces both forms to the same key.
                    const ALIASES = {
                      'wolverhampton wanderers': 'wolves',
                      'tottenham hotspur': 'tottenham',
                      'newcastle united': 'newcastle',
                      'west ham united': 'west ham',
                      'leeds united': 'leeds',
                      'brighton hove albion': 'brighton',
                      'brighton hove': 'brighton',
                      'nottingham forest': 'forest',
                      'manchester united': 'man united',
                      'manchester city': 'man city',
                      'sheffield united': 'sheff united',
                      'sheffield wednesday': 'sheff wednesday',
                      'crystal palace': 'palace',
                      'leicester city': 'leicester',
                      'norwich city': 'norwich',
                      'cardiff city': 'cardiff',
                      'swansea city': 'swansea',
                      'bayern munich': 'bayern',
                      'borussia dortmund': 'dortmund',
                      'paris saint germain': 'psg',
                      'paris saint-germain': 'psg',
                      'real madrid': 'madrid real',
                      'atletico madrid': 'madrid atletico',
                      'atletico de madrid': 'madrid atletico',
                      'inter milan': 'inter',
                      'internazionale': 'inter',
                      'ac milan': 'milan'
                    };
                    function normalise(name) {
                      if (!name) return '';
                      let s = name.toLowerCase()
                        .replace(/[\\.\\-_,]/g, ' ')
                        .replace(/[^\\w\\s]/g, '')
                        .replace(/\\s+/g, ' ')
                        .trim();
                      // Apply aliases
                      for (const [from, to] of Object.entries(ALIASES)) {
                        if (s.includes(from)) { s = s.replace(from, to); break; }
                      }
                      // Remove stop words
                      return s.split(' ').filter(w => w && !STOP.has(w)).join(' ');
                    }
                    function tokens(name) {
                      const n = normalise(name);
                      return new Set(n.split(' ').filter(Boolean));
                    }
                    function similarity(a, b) {
                      const ta = tokens(a), tb = tokens(b);
                      if (!ta.size || !tb.size) return 0;
                      let shared = 0;
                      for (const t of ta) if (tb.has(t)) shared++;
                      return shared / Math.max(ta.size, tb.size);
                    }
                    function findBestMatch(oddsHome, oddsAway, existingMatches) {
                      let bestId = null, bestScore = 0;
                      for (const [id, m] of Object.entries(existingMatches)) {
                        if (m.result) continue; // skip finished
                        const homeScore = similarity(oddsHome, m.home);
                        const awayScore = similarity(oddsAway, m.away);
                        const combined = (homeScore + awayScore) / 2;
                        if (combined > bestScore && homeScore >= 0.5 && awayScore >= 0.5) {
                          bestScore = combined;
                          bestId = id;
                        }
                      }
                      return bestId;
                    }
                    // ================================

                    for (const ev of (oddsData || [])) {
                      const home = ev.home_team, away = ev.away_team;
                      const matchId = findBestMatch(home, away, matches);
                      if (!matchId) {
                        unmatched.push(home + ' vs ' + away);
                        continue;
                      }
                      const match = matches[matchId];
                      const safeRound = match.round ? match.round.replace(/[.#\$\[\]/]/g, '_') : '';
                      if (safeRound && lockedRounds[safeRound]) { oddsSkipped++; continue; }
                      const bk = (ev.bookmakers || [])[0];
                      if (!bk) continue;
                      const market = (bk.markets || []).find(m => m.key === 'h2h');
                      if (!market) continue;
                      let oh, od, oa;
                      // Match outcome names to home/away using same fuzzy logic
                      market.outcomes.forEach(o => {
                        if (similarity(o.name, match.home) >= 0.5) oh = o.price;
                        else if (similarity(o.name, match.away) >= 0.5) oa = o.price;
                        else if (o.name === 'Draw') od = o.price;
                      });
                      if (oh && oa) {
                        const jitter = () => 1 + (Math.random() * 0.1 - 0.05);
                        await fbPatch('comps/' + compId + '/matches/' + matchId, {
                          oddsH: oh, oddsD: od || oh, oddsA: oa,
                          noisyH: Math.round(oh * jitter() * 100) / 100,
                          noisyD: od ? Math.round(od * jitter() * 100) / 100 : null,
                          noisyA: Math.round(oa * jitter() * 100) / 100
                        });
                        oddsUpdated++;
                      }
                    }
                    console.log('  Odds: ' + oddsUpdated + ' updated, ' + oddsSkipped + ' locked, ' + unmatched.length + ' unmatched');
                    if (unmatched.length) {
                      console.log('  Unmatched events (first 5):');
                      unmatched.slice(0, 5).forEach(u => console.log('    - ' + u));
                    }
                  } else {
                    const errText = await oddsResp.text();
                    if (errText.includes('UNKNOWN_SPORT')) console.log('  Odds: not in season yet');
                    else console.log('  Odds error: ' + oddsResp.status);
                  }
                } catch (e) {
                  console.log('  Odds fetch failed:', e.message);
                }
              }

              await sleep(2000);

              // FETCH ALL MATCHES from football-data.org (imports new + updates results)
              if (comp.fdCode && comp.fdSeason) {
                try {
                  const url = 'https://api.football-data.org/v4/competitions/' + comp.fdCode + '/matches?season=' + comp.fdSeason;
                  const resResp = await fetch(url, { headers: { 'X-Auth-Token': FD_KEY } });
                  if (!resResp.ok) {
                    console.log('  Matches API error: ' + resResp.status);
                  } else {
                    const resData = await resResp.json();
                    const matches = comp.matches || {};
                    let added = 0, updated = 0, skipped = 0;
                    for (const mx of (resData.matches || [])) {
                      const apiId = 'fd_' + mx.id;
                      const existing = matches[apiId];
                      const home = (mx.homeTeam && mx.homeTeam.name) || 'TBD';
                      const away = (mx.awayTeam && mx.awayTeam.name) || 'TBD';
                      const dt = mx.utcDate;
                      const venue = mx.venue || '';
                      // Round/stage detection
                      let round = 'Regular Season', stage = 'group';
                      if (mx.matchday) round = 'Matchday ' + mx.matchday;
                      if (mx.stage) {
                        const s = mx.stage.toLowerCase();
                        if (s.includes('group')) {
                          stage = 'group';
                          round = mx.group ? 'Group ' + mx.group.replace('GROUP_', '') : 'Group Stage';
                        } else if (s.includes('final') || s.includes('quarter') || s.includes('semi') || s.includes('round_of') || s.includes('playoff') || s.includes('play_off')) {
                          stage = 'knockout';
                          round = mx.stage.replace(/_/g, ' ').toLowerCase().replace(/\\b\\w/g, c => c.toUpperCase());
                        } else if (s.includes('regular')) {
                          stage = 'group';
                          round = 'Matchday ' + (mx.matchday || '?');
                        }
                      }
                      const localDt = new Date(dt).toISOString().slice(0, 16);
                      // Capture result if present
                      let result = null, scoreH = null, scoreA = null;
                      if (mx.status === 'FINISHED' && mx.score && mx.score.fullTime) {
                        scoreH = mx.score.fullTime.home;
                        scoreA = mx.score.fullTime.away;
                        if (scoreH > scoreA) result = 'H';
                        else if (scoreA > scoreH) result = 'A';
                        else result = 'D';
                      }
                      if (existing && existing.result) {
                        // Already finished — never re-fetch
                        skipped++;
                      } else if (!existing) {
                        // Brand new match — full insert
                        await fbPatch('comps/' + compId + '/matches/' + apiId, {
                          id: apiId, apiId, home, away, datetime: localDt, venue, round, stage,
                          oddsH: null, oddsD: null, oddsA: null,
                          result, scoreH, scoreA, created: Date.now()
                        });
                        added++;
                      } else if (result && !existing.result) {
                        // Existing match, new result — just update result fields
                        await fbPatch('comps/' + compId + '/matches/' + apiId, { result, scoreH, scoreA });
                        updated++;
                      } else {
                        skipped++;
                      }
                    }
                    console.log('  Matches: ' + added + ' added, ' + updated + ' results, ' + skipped + ' unchanged');
                  }
                } catch (e) {
                  console.log('  Matches fetch failed:', e.message);
                }
              }

              // AUTO-LOCK rounds within 7 days
              if (comp.matches) {
                const manuallyUnlocked = comp.manuallyUnlockedRounds || {};
                const earliestByRound = {};
                Object.values(comp.matches).forEach(m => {
                  if (!m.round || !m.datetime) return;
                  const t = new Date(m.datetime).getTime();
                  if (!earliestByRound[m.round] || t < earliestByRound[m.round])
                    earliestByRound[m.round] = t;
                });
                const now = Date.now();
                const SEVEN = 7 * 24 * 60 * 60 * 1000;
                let lockedCount = 0;
                for (const [round, earliest] of Object.entries(earliestByRound)) {
                  const safeKey = round.replace(/[.#\$\[\]/]/g, '_');
                  if (lockedRounds[safeKey]) continue;
                  if (manuallyUnlocked[safeKey]) continue; // respect admin's override
                  if (earliest - now <= SEVEN && earliest > now - SEVEN) {
                    await fbPatch('comps/' + compId + '/lockedRounds', { [safeKey]: true });
                    lockedCount++;
                  }
                }
                if (lockedCount) console.log('  Auto-locked ' + lockedCount + ' rounds');
              }

              await sleep(3000);
            }
            console.log('\\n✅ Done');
          })();
          "
